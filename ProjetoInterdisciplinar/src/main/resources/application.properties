iolink.simulado=false
iolink.base-url=http://10.110.12.41
iolink.timeout-ms=2000
iolink.intervalo-ms=500
iolink.offline-apos-ms=5000

# Porta 1: sensor de peca metalica (pulso = peca passando)
iolink.portas[0].numero=1
iolink.portas[0].nome=Sensor de peca metalica
iolink.portas[0].funcao=PECA_METALICA
iolink.portas[0].byte-index=0
iolink.portas[0].bit-index=0
iolink.portas[0].invertido=false

# Porta 2: sensor de peca nao metalica
iolink.portas[1].numero=2
iolink.portas[1].nome=Sensor de peca nao metalica
iolink.portas[1].funcao=PECA_NAO_METALICA
iolink.portas[1].byte-index=0
iolink.portas[1].bit-index=0
iolink.portas[1].invertido=false

# Porta 3: sensor de nivel do reservatorio (valor bruto -> 0..100 %)
iolink.portas[2].numero=3
iolink.portas[2].nome=Sensor de nivel do reservatorio
iolink.portas[2].funcao=NIVEL_RESERVATORIO
iolink.portas[2].byte-index=0
iolink.portas[2].tamanho-bytes=2
iolink.portas[2].com-sinal=false
iolink.portas[2].valor-vazio=0
iolink.portas[2].valor-cheio=1000