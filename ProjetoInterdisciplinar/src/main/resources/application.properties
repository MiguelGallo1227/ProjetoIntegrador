spring.application.name=ProjetoInterdisciplinar
server.port=8081


spring.datasource.url=jdbc:mysql://localhost:3306/metaltech?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.origens=http://localhost:5173
app.esteira.id=ESTEIRA-01
app.esteira.nome=Esteira de triagem 01

iolink.simulado=false
iolink.base-url=http://10.110.12.41
iolink.timeout-ms=2000
iolink.intervalo-ms=200
iolink.offline-apos-ms=5000
# historico do sensor de distancia no banco: a cada 10 s
iolink.historico-min-ms=10000
# tempo com os dois sensores livres para a peca ser considerada fora (ms)
iolink.fim-peca-ms=300
# passagem mais longa que isso = sensor travado (conta a peca e espera os sensores liberarem)
iolink.max-peca-ms=5000
# true = tambem grava cada mudanca dos sensores de peca em leitura_sensor (so para depurar)
iolink.historico-sensores-peca=false

# Porta 1: sensor de distancia (mede o nivel do reservatorio)
# valor-vazio = leitura bruta com o reservatorio vazio (sensor longe do liquido)
# valor-cheio = leitura bruta com o reservatorio cheio (sensor perto)
iolink.portas[0].numero=1
iolink.portas[0].nome=Sensor de distancia (nivel)
iolink.portas[0].funcao=NIVEL_RESERVATORIO
iolink.portas[0].byte-index=0
iolink.portas[0].tamanho-bytes=2
iolink.portas[0].com-sinal=false
iolink.portas[0].valor-vazio=400
iolink.portas[0].valor-cheio=50

# Porta 2: sensor indutivo (embaixo) - manda um valor analogico de 16 bits.
# Medido: sem peca = 558 (022E), nao metalica = 2711 (0A97), metalica = 7921 (1EF1).
# limiar entre a nao metalica e a metalica: acima dele, o indutivo pegou (peca metalica).
iolink.portas[1].numero=2
iolink.portas[1].nome=Sensor indutivo
iolink.portas[1].funcao=SENSOR_INDUTIVO
iolink.portas[1].byte-index=0
iolink.portas[1].tamanho-bytes=2
iolink.portas[1].com-sinal=false
iolink.portas[1].limiar=5000
iolink.portas[1].invertido=false

# Porta 3: sensor capacitivo (em cima) - tambem analogico de 16 bits.
# Medido: com peca metalica = 10011 (271B); outro valor medido = 32736 (7FE0).
# PROVISORIO: falta o valor SEM peca para definir o limiar certo.
iolink.portas[2].numero=3
iolink.portas[2].nome=Sensor capacitivo
iolink.portas[2].funcao=SENSOR_CAPACITIVO
iolink.portas[2].byte-index=0
iolink.portas[2].tamanho-bytes=2
iolink.portas[2].com-sinal=false
iolink.portas[2].limiar=5000
iolink.portas[2].invertido=false
