spring.application.name=ProjetoInterdisciplinar
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/metaltech?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
