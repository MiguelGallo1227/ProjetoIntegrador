spring.application.name=ProjetoInterdisciplinar
server.port=8081


spring.datasource.url=jdbc:mysql://localhost:3306/metaltech?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.origens=http://localhost:5173
app.esteira.id=ESTEIRA-01
app.esteira.nome=Esteira de triagem 01

iolink.simulado=false
# So usado pelas portas SEM "url" (leitura direta do mestre IO-Link)
iolink.base-url=http://10.110.12.41
iolink.timeout-ms=2000
# pausa entre um ciclo de leitura dos sensores de PECA e o proximo. Quanto menor, menos chance de o indutivo
# (alcance curto, a peca passa por ele em poucos ms) ficar entre duas leituras. Veja o periodo real em
# GET /api/diagnostico (periodoAmostragemMs): o ideal e bem menor que o tempo que a peca fica sob o indutivo.
iolink.intervalo-ms=20
# o sensor de distancia (nivel) e lido em segundo plano a cada tanto, sem segurar o ciclo das pecas
iolink.nivel-intervalo-ms=1000
iolink.offline-apos-ms=5000
# historico do sensor de distancia no banco: a cada 10 s
iolink.historico-min-ms=10000
# tempo com os dois sensores livres para a peca ser considerada fora (ms). O valor efetivo nunca fica
# abaixo de 2,5 ciclos de leitura (ver periodoAmostragemMs), mesmo que este numero seja menor.
iolink.fim-peca-ms=150
# passagem mais longa que isso = sensor travado (conta a peca e espera os sensores liberarem)
iolink.max-peca-ms=5000
# true = tambem grava cada mudanca dos sensores de peca em leitura_sensor (so para depurar)
iolink.historico-sensores-peca=false

# Porta 1: sensor de distancia (mede o nivel do reservatorio)
# valor-vazio = leitura bruta com o reservatorio vazio (sensor longe do liquido)
# valor-cheio = leitura bruta com o reservatorio cheio (sensor perto)
# Cada sensor tem a sua API. Elas respondem {"cid":-1,"data":{"value":"1F1D"},"code":200}: o value e
# hexadecimal (1F1D = 7965), por isso hexadecimal=true em todas. "campo" (nome do campo JSON com o valor), "hexadecimal" (true/false) e
# "escala" (decimal x escala = inteiro lido) sao opcionais: veja a coluna "Resposta da API" na pagina
# http://localhost:8080/ e ajuste se o valor nao for achado ou vier no formato errado.
iolink.portas[0].numero=1
iolink.portas[0].url=http://10.110.12.37:5000/sensores/distancia
iolink.portas[0].hexadecimal=true
iolink.portas[0].nome=Sensor de distancia (nivel)
iolink.portas[0].funcao=NIVEL_RESERVATORIO
iolink.portas[0].byte-index=0
iolink.portas[0].tamanho-bytes=2
iolink.portas[0].com-sinal=false
iolink.portas[0].valor-vazio=400
iolink.portas[0].valor-cheio=50

# Porta 2: sensor INDUTIVO (embaixo). Medido direto na API .../sensores/indutivo (hex = decimal):
#   com METAL      279B = 10139   (o valor CAI)
#   com NAO METAL  7FE0 = 32736   (= fora de alcance = o mesmo valor de esteira livre: indutivo nao ve plastico)
# Ou seja: livre ~32736 e a peca metalica faz o valor CAIR. Por isso invertido=true: o projeto aprende o valor
# livre (~32736) e o sensor "pega" quando ele cai 10000 abaixo (<= ~22736). Pegou = peca metalica.
# Ligue a aplicacao com a esteira livre.
iolink.portas[1].numero=2
iolink.portas[1].url=http://10.110.12.37:5000/sensores/indutivo
iolink.portas[1].hexadecimal=true
iolink.portas[1].nome=Sensor indutivo
iolink.portas[1].funcao=SENSOR_INDUTIVO
iolink.portas[1].byte-index=0
iolink.portas[1].tamanho-bytes=2
iolink.portas[1].com-sinal=false
iolink.portas[1].invertido=true
iolink.portas[1].delta=10000

# Porta 3: sensor CAPACITIVO (em cima). Medido direto na API .../sensores/capacitivo (hex = decimal):
#   esteira livre  0242 = 578
#   NAO METAL      07A9 = 1961  (outras medidas: 0785 = 1925, 0A97 = 2711)
#   METAL          1DBF = 7615  (outras medidas: 1CC7 = 7367, 1EF1 = 7921)
# O valor SOBE com qualquer peca e sobe muito mais com metal. delta=800: pega a partir de ~+800 sobre o valor
# livre (cobre o plastico, que sobe ~1400 ou mais) e nao confunde com a esteira vazia.
# limiar-metal=5000: se o pico do capacitivo na passagem chegar a 5000 (plastico fica abaixo de 2711, metal
# acima de 7367), a peca e METALICA mesmo que o indutivo, de alcance curto, nao tenha sido amostrado.
iolink.portas[2].numero=3
iolink.portas[2].url=http://10.110.12.37:5000/sensores/capacitivo
iolink.portas[2].hexadecimal=true
iolink.portas[2].nome=Sensor capacitivo
iolink.portas[2].funcao=SENSOR_CAPACITIVO
iolink.portas[2].byte-index=0
iolink.portas[2].tamanho-bytes=2
iolink.portas[2].com-sinal=false
iolink.portas[2].delta=800
iolink.portas[2].limiar-metal=5000
